<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CampusDesk · 学习，一目了然</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true">c<span>·</span></span><span>CampusDesk<small>学习，一目了然</small></span></a>
      <div class="sidebar-label">我的校园</div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom"><div class="desk-note"><span class="status-dot"></span> 北京时间 <span id="sidebar-clock">—</span><small>把今天留给重要的事。</small></div><button class="nav-item settings-nav" data-page="settings" type="button"><span class="icon" id="settings-icon"></span>连接与设置</button></div>
    </aside>
    <main id="main" tabindex="-1">
      <header class="topbar"><span class="breadcrumb">我的校园 <span>/</span> <span id="breadcrumb-page">总览</span></span><div class="toolbar"><span id="global-status" class="subtle">尚未同步</span><button id="sync-button" class="button button-light" type="button"><span id="sync-icon"></span><span>同步数据</span></button></div></header>
      <div id="content" class="content"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="task-dialog"><form id="task-form"><div class="dialog-heading"><h2>添加待办</h2><button class="icon-button" type="button" data-action="close-task" aria-label="关闭">×</button></div><p class="subtle">个人待办保存在这台 Mac，不会提交至学校系统。</p><label>要做什么<input id="task-title" name="title" required maxlength="180" placeholder="例如：整理今天的化学笔记" autocomplete="off"></label><label>截止时间（可选）<input id="task-due" name="due" type="datetime-local"></label><p class="field-hint">按北京时间记录。</p><div class="dialog-actions"><button type="button" class="button button-light" data-action="close-task">取消</button><button type="submit" class="button button-primary">添加待办</button></div></form></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script src="core.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
